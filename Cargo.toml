[package]
name = "slack-web-api"
version = "0.2.1"
edition = "2021"
rust-version = "1.88"
authors = ["uiuifree"]
description = "Typed async Slack Web API client for Rust: all 330 methods incl. admin, Block Kit, pagination, file upload, rate-limit retry (reqwest + rustls, no OpenSSL)"
license = "MIT"
readme = "README.md"
homepage = "https://github.com/uiuifree/rust-slack-web-api"
repository = "https://github.com/uiuifree/rust-slack-web-api"
documentation = "https://docs.rs/slack-web-api"
keywords = ["slack", "slack-api", "block-kit", "chat", "bot"]
categories = ["api-bindings", "web-programming::http-client", "asynchronous"]
exclude = ["codegen/", ".idea/", ".github/", "AGENTS.md"]

[dependencies]
bytes = "1"
form_urlencoded = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["time", "rt"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6"
